[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libero-custom-object"
version = "0.1.0"
description = "External custom object extension for LIBERO."
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["libero_custom_object*"]

[tool.setuptools.package-data]
libero_custom_object = [
  "assets/manifest.yaml",
  "assets/objects/alphabet_soup/*",
  "assets/objects/alphabet_soup/visual/*",
  "assets/objects/knife/*",
  "assets/objects/scissors/*",
  "assets/objects/hammer/*",
  "assets/objects/steak_knife/*",
  "assets/objects/can_opener/*",
  "bddl_files/*.bddl",
]
