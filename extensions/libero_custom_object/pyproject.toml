[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libero-custom-object"
version = "0.1.0"
description = "External custom object extension for LIBERO."
requires-python = ">=3.8"

[project.optional-dependencies]
dataset = ["datasets", "huggingface_hub", "pillow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["libero_custom_object*"]

[tool.setuptools.package-data]
libero_custom_object = [
  "assets/manifest.yaml",
  "assets/objects/alphabet_soup/*",
  "assets/objects/alphabet_soup/visual/*",
  "assets/objects/gift_box/*",
  "assets/objects/gift_box_lid/*",
  "assets/objects/balls/**/*",
  "assets/objects/cardboard_box/**/*",
  "assets/objects/cereal_box/**/*",
  "assets/objects/large_plate/**/*",
  "assets/objects/reference_black_book_flat/**/*",
  "assets/objects/reference_black_book_flat_gift/**/*",
  "assets/objects/reference_black_book_flat_microwave/**/*",
  "assets/objects/reference_black_book_flat_stove/**/*",
  "assets/objects/reference_white_cutting_board_flat/**/*",
  "assets/objects/reference_white_cutting_board_flat_gift/**/*",
  "assets/objects/reference_white_cutting_board_flat_microwave/**/*",
  "assets/objects/reference_white_cutting_board_flat_stove/**/*",
  "assets/objects/toy_props/**/*",
  "assets/objects/knife/*",
  "assets/objects/scissors/*",
  "assets/objects/hammer/*",
  "assets/objects/steak_knife/*",
  "assets/objects/can_opener/*",
  "assets/objects/obvious_hazards/**/*",
  "assets/objects/robocasa/**/*",
  "bddl_files/*.bddl",
]
